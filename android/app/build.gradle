plugins { id 'com.android.application' }

android {
    namespace 'com.mobiletryon.demo'
    compileSdk 35
    defaultConfig {
        applicationId 'com.mobiletryon.demo'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a' }
        testInstrumentationRunner 'com.mobiletryon.demo.TryOnInstrumentation'
    }
    signingConfigs {
        debug { storeFile file('../debug.keystore') }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    androidResources { noCompress += ['mnn', 'f32', 'task', 'tflite'] }
}

dependencies {
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
}
